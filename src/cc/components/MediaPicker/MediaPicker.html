<!doctype html>
<html lang="en" data-brand="cc">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../../components/dark-mode-toggle.js"></script>
  <title>MediaPicker — Control Centre</title>
  <link rel="stylesheet" href="../../../styles/base.css">
  <link rel="stylesheet" href="../../../components/Button/Button.css">
  <link rel="stylesheet" href="MediaPicker.css">
  <style>
    body { margin: 0; padding: var(--ai-spacing-7); background: var(--cc-ui-primary-bg); min-height: 100vh; color: var(--ai-text-primary); font-family: var(--ai-font-body); }
    .demo-section { max-width: var(--demo-w, none); padding: var(--ai-spacing-6); background: var(--ai-surface-primary); border: 1px solid var(--ai-border-secondary); border-radius: var(--ai-radius-lg); margin-bottom: var(--ai-spacing-5); }
    .demo-section--bare { background: transparent; border: 0; padding: 0; }
    .demo-section__title { font-size: var(--ai-font-fixed-xs); font-weight: var(--ai-font-semibold); color: var(--ai-text-contrast); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 var(--ai-spacing-5); }
    .demo-note { margin: 0 0 var(--ai-spacing-5); font-size: var(--ai-font-fixed-xs); color: var(--ai-text-secondary); }
    .demo-stack { display: flex; flex-direction: column; gap: var(--ai-spacing-5); }
    .demo-narrow { max-width: var(--ai-size-7); }
  </style>
</head>
<body>
  <div class="demo-section ">
    <p class="demo-section__title">State=Empty</p>
    <div class="media-picker">
              <button type="button" class="media-picker__thumb" aria-label="Choose Thumbnail" aria-haspopup="dialog"><i data-lucide="image" aria-hidden="true"></i></button>
              <div class="media-picker__actions">
                <button type="button" class="btn btn--secondary btn--sm btn--icon" aria-label="Edit Thumbnail"><i data-lucide="pencil" aria-hidden="true"></i></button>
                <button type="button" class="btn btn--secondary btn--sm btn--icon" aria-label="Remove Thumbnail"><i data-lucide="trash-2" aria-hidden="true"></i></button>
              </div>
            </div>
  </div>
  <div class="demo-section ">
    <p class="demo-section__title">State=Filled</p>
    <div class="media-picker">
              <button type="button" class="media-picker__thumb" aria-label="Choose Main Image" aria-haspopup="dialog"><img src="../../../../img/record/article-thumb.jpg" alt=""></button>
              <div class="media-picker__actions">
                <button type="button" class="btn btn--secondary btn--sm btn--icon" aria-label="Edit Main Image"><i data-lucide="pencil" aria-hidden="true"></i></button>
                <button type="button" class="btn btn--secondary btn--sm btn--icon" aria-label="Remove Main Image"><i data-lucide="trash-2" aria-hidden="true"></i></button>
              </div>
            </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>

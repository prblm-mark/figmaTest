<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../dark-mode-toggle.js"></script>
  <title>Toggle — Component Demo</title>
  <link rel="stylesheet" href="../../styles/base.css">
  <link rel="stylesheet" href="Toggle.css">
  <style>
    body {
      padding: var(--ao-spacing-7);
      display: flex;
      flex-direction: column;
      gap: var(--ao-spacing-7);
      background-color: var(--ao-surface-secondary);
      min-height: 100vh;
    }
    .demo-section {
      display: flex;
      flex-direction: column;
      gap: var(--ao-spacing-5);
      padding: var(--ao-spacing-6);
      background-color: var(--ao-surface-primary);
      border-radius: var(--ao-radius-lg);
    }
    .demo-section h2 {
      font-family: var(--ao-font-title);
      font-weight: var(--ao-font-bold);
      font-size: var(--ao-font-fixed-sm);
      color: var(--ao-text-primary);
      margin: 0;
    }
    .demo-row {
      display: flex;
      align-items: center;
      gap: var(--ao-spacing-6);
    }
    .demo-label {
      font-size: var(--ao-font-fixed-xxs);
      color: var(--ao-text-contrast);
      min-width: 80px;
    }
  </style>
</head>
<body>

  <div class="demo-section">
    <h2>Toggle — xs (32×16)</h2>
    <div class="demo-row">
      <span class="demo-label">Initial</span>
      <button class="toggle toggle--xxs" type="button" role="switch" aria-checked="false" aria-label="Only free seats">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Active</span>
      <button class="toggle toggle--xxs toggle--active" type="button" role="switch" aria-checked="true" aria-label="Only free seats">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Initial</span>
      <button class="toggle toggle--xs" type="button" role="switch" aria-checked="false" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Active</span>
      <button class="toggle toggle--xs toggle--active" type="button" role="switch" aria-checked="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Disabled</span>
      <button class="toggle toggle--xs toggle--disabled" type="button" role="switch" aria-checked="false" aria-disabled="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <button class="toggle toggle--xs" type="button" role="switch" aria-checked="false">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
        <span class="toggle__label">
          <span class="toggle__label-text">Icon Navigation</span>
        </span>
      </button>
    </div>
  </div>

  <div class="demo-section">
    <h2>Toggle — SM (40×20, default size)</h2>
    <div class="demo-row">
      <span class="demo-label">Initial</span>
      <button class="toggle" type="button" role="switch" aria-checked="false" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Active</span>
      <button class="toggle toggle--active" type="button" role="switch" aria-checked="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Disabled</span>
      <button class="toggle toggle--disabled" type="button" role="switch" aria-checked="false" aria-disabled="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <button class="toggle" type="button" role="switch" aria-checked="false">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
        <span class="toggle__label">
          <span class="toggle__label-text">Show Borders</span>
          <span class="toggle__helper">Some helper text here</span>
        </span>
      </button>
    </div>
  </div>

  <div class="demo-section">
    <h2>Toggle — Default (44×24)</h2>
    <div class="demo-row">
      <span class="demo-label">Initial</span>
      <button class="toggle toggle--default" type="button" role="switch" aria-checked="false" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Active</span>
      <button class="toggle toggle--default toggle--active" type="button" role="switch" aria-checked="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Disabled</span>
      <button class="toggle toggle--default toggle--disabled" type="button" role="switch" aria-checked="false" aria-disabled="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <button class="toggle toggle--default" type="button" role="switch" aria-checked="false">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
        <span class="toggle__label">
          <span class="toggle__label-text">Write label text here</span>
          <span class="toggle__helper">Some helper text here</span>
        </span>
      </button>
    </div>
  </div>

  <div class="demo-section">
    <h2>Toggle — LG (56×28)</h2>
    <div class="demo-row">
      <span class="demo-label">Initial</span>
      <button class="toggle toggle--lg" type="button" role="switch" aria-checked="false" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Active</span>
      <button class="toggle toggle--lg toggle--active" type="button" role="switch" aria-checked="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <span class="demo-label">Disabled</span>
      <button class="toggle toggle--lg toggle--disabled" type="button" role="switch" aria-checked="false" aria-disabled="true" aria-label="Toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
    <div class="demo-row">
      <button class="toggle toggle--lg" type="button" role="switch" aria-checked="false">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
        <span class="toggle__label">
          <span class="toggle__label-text">Write label text here</span>
          <span class="toggle__helper">Some helper text here</span>
        </span>
      </button>
    </div>
  </div>

  <div class="demo-section">
    <h2>Interactive (click to toggle)</h2>
    <div class="demo-row">
      <button class="toggle toggle--active" type="button" role="switch" aria-checked="true" id="demo-toggle">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
        <span class="toggle__label">
          <span class="toggle__label-text">Click to toggle</span>
        </span>
      </button>
    </div>
  </div>

  <script src="Toggle.js"></script>

</body>
</html>

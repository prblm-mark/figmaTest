<!doctype html>
<html lang="en" data-brand="cc">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../../components/dark-mode-toggle.js"></script>
  <title>ViewerList — Control Centre</title>
  <link rel="stylesheet" href="../../../styles/base.css">
  <link rel="stylesheet" href="../../../components/Button/Button.css">
  <link rel="stylesheet" href="../../../components/Avatar/Avatar.css">
  <link rel="stylesheet" href="../../../components/Portraits/Portraits.css">
  <link rel="stylesheet" href="../../components/ViewerItem/ViewerItem.css">
  <link rel="stylesheet" href="ViewerList.css">
  <style>
    body { margin: 0; padding: var(--ai-spacing-7); background: var(--cc-ui-primary-bg); min-height: 100vh; color: var(--ai-text-primary); font-family: var(--ai-font-body); }
    .demo-section { max-width: var(--demo-w, none); padding: var(--ai-spacing-6); background: var(--ai-surface-primary); border: 1px solid var(--ai-border-secondary); border-radius: var(--ai-radius-lg); margin-bottom: var(--ai-spacing-5); }
    .demo-section--bare { background: transparent; border: 0; padding: 0; }
    .demo-section__title { font-size: var(--ai-font-fixed-xs); font-weight: var(--ai-font-semibold); color: var(--ai-text-contrast); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 var(--ai-spacing-5); }
    .demo-note { margin: 0 0 var(--ai-spacing-5); font-size: var(--ai-font-fixed-xs); color: var(--ai-text-secondary); }
    .demo-stack { display: flex; flex-direction: column; gap: var(--ai-spacing-5); }
    .demo-narrow { max-width: var(--ai-size-7); }
  </style>
</head>
<body>
  <div class="demo-section ">
    <p class="demo-section__title">ViewerList</p>
    <div class="demo-narrow"><div class="viewer-list">
            <ul class="viewer-list__items"><li class="viewer-item">
              <div class="avatar"><img class="portrait" src="https://i.pravatar.cc/64?u=simon" alt=""></div>
              <div class="viewer-item__body">
                <div class="viewer-item__identity">
                  <div class="viewer-item__who"><p class="viewer-item__name">Simon Hassell</p><p class="viewer-item__role">Principal, Argutus Consulting</p></div>
                  <p class="viewer-item__time">5 days, 18hrs</p>
                </div>
                <div class="viewer-item__companies"><a class="btn btn--tertiary btn--xs" href="#"><span>Argutus</span></a><a class="btn btn--tertiary btn--xs" href="#"><span>Playbook Media Trading Company</span></a></div>
              </div>
            </li><li class="viewer-item">
              <div class="avatar"><img class="portrait" src="https://i.pravatar.cc/64?u=david" alt=""></div>
              <div class="viewer-item__body">
                <div class="viewer-item__identity">
                  <div class="viewer-item__who"><p class="viewer-item__name">David Delawa</p><p class="viewer-item__role">VP of Media, Ocean Media Group Ltd</p></div>
                  <p class="viewer-item__time">5 days, 18hrs</p>
                </div>
                <div class="viewer-item__companies"><a class="btn btn--tertiary btn--xs" href="#"><span>Ocean Media Group Ltd</span></a></div>
              </div>
            </li></ul>
            <!-- TODO(backend:RecordScreen): "Add to Contact List" → add the viewers to a contact list (list picker + POST) -->
            <button type="button" class="btn btn--secondary btn--sm" data-backend-todo="viewers-add-to-contact-list"><span>Add to Contact List</span></button>
          </div></div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>

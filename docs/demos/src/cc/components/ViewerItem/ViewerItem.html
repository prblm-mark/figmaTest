<!doctype html>
<html lang="en" data-brand="cc">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../../components/dark-mode-toggle.js"></script>
  <title>ViewerItem — Control Centre</title>
  <link rel="stylesheet" href="../../../styles/base.css">
  <link rel="stylesheet" href="../../../components/Button/Button.css">
  <link rel="stylesheet" href="../../../components/Avatar/Avatar.css">
  <link rel="stylesheet" href="../../../components/Portraits/Portraits.css">
  <link rel="stylesheet" href="ViewerItem.css">
  <style>
    body { margin: 0; padding: var(--ao-spacing-7); background: var(--cc-ui-primary-bg); min-height: 100vh; color: var(--ao-text-primary); font-family: var(--ao-font-body); }
    .demo-section { max-width: var(--demo-w, none); padding: var(--ao-spacing-6); background: var(--ao-surface-primary); border: 1px solid var(--ao-border-secondary); border-radius: var(--ao-radius-lg); margin-bottom: var(--ao-spacing-5); }
    .demo-section--bare { background: transparent; border: 0; padding: 0; }
    .demo-section__title { font-size: var(--ao-font-fixed-xs); font-weight: var(--ao-font-semibold); color: var(--ao-text-contrast); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 var(--ao-spacing-5); }
    .demo-note { margin: 0 0 var(--ao-spacing-5); font-size: var(--ao-font-fixed-xs); color: var(--ao-text-secondary); }
    .demo-stack { display: flex; flex-direction: column; gap: var(--ao-spacing-5); }
    .demo-narrow { max-width: var(--ao-size-7); }
  </style>
</head>
<body>
  <div class="demo-section ">
    <p class="demo-section__title">ViewerItem</p>
    <div class="demo-narrow"><div class="viewer-item">
              <div class="avatar"><img class="portrait" src="https://i.pravatar.cc/64?u=simon" alt=""></div>
              <div class="viewer-item__body">
                <div class="viewer-item__identity">
                  <div class="viewer-item__who"><p class="viewer-item__name">Simon Hassell</p><p class="viewer-item__role">Principal, Argutus Consulting</p></div>
                  <p class="viewer-item__time">5 days, 18hrs</p>
                </div>
                <div class="viewer-item__companies"><a class="btn btn--tertiary btn--xs" href="#"><span>Argutus</span></a><a class="btn btn--tertiary btn--xs" href="#"><span>Playbook Media Trading Company</span></a></div>
              </div>
            </div></div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
